name: e2e

# Playwright end-to-end suite against a real production build + PostgreSQL.
# Runs on every PR so a broken login, search, approval flow, or API ships
# nowhere.

on:
  pull_request:
  workflow_dispatch:

# Checkout and artifact upload only; nothing writes to the repository.
permissions:
  contents: read

jobs:
  e2e:
    runs-on: ubuntu-latest
    # Installing the test browser once took 8 minutes and the job ran out of time at 30.
    timeout-minutes: 40
    services:
      postgres:
        image: postgres:16
        env:
          POSTGRES_USER: compass
          POSTGRES_PASSWORD: compass
          POSTGRES_DB: compass_e2e
        ports: ["5432:5432"]
        options: >-
          --health-cmd "pg_isready -U compass"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 10
    env:
      DATABASE_URL: postgresql://compass:compass@127.0.0.1:5432/compass_e2e
      COMPASSDOCS_DB_URL: postgresql://compass:compass@127.0.0.1:5432/compass_e2e
      COMPASSDOCS_ADMIN_USER: e2e_admin
      COMPASSDOCS_ADMIN_PASSWORD: E2eAdmin!12345
      PORT: 3998
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v7
        with:
          node-version: 24
          cache: npm
      # STYLEGUIDE.md gate: plain Node with no dependencies, so it runs before
      # `npm ci` and fails a PR in seconds rather than after the build. It
      # reports file:line per violation and fails only on violations missing
      # from scripts/styleguide-baseline.json (or on a fixed one still in it).
      # The guard tests in test/style-*.test.ts run in the integration step
      # below. Here, in the required e2e job, rather than a job of its own: a
      # new job name would need the ruleset changed first
      # (.github/rulesets/README.md).
      - name: Style guide check
        run: node scripts/check-styleguide.mjs
      - run: npm ci
      # 1.21.2: Azurite, the Azure Storage emulator, for the blob file store's
      # tests (test/support/azurite.ts). In CI those tests fail rather than
      # skip without it, so it is started (and waited for) here.
      - name: Start Azurite
        run: |
          npx --yes azurite@3.37.0 azurite-blob --silent --skipApiVersionCheck --loose \
            --location "$RUNNER_TEMP/azurite" --blobHost 127.0.0.1 --blobPort 10000 &
          for i in $(seq 1 90); do
            (echo > /dev/tcp/127.0.0.1/10000) 2>/dev/null && exit 0
            sleep 1
          done
          echo "::error::Azurite did not start on 127.0.0.1:10000"
          exit 1
      # Before the build, because these talk to the database directly and have
      # no opinion about the server: a failure here is a data-layer failure and
      # says so, instead of arriving 3 minutes later behind a build.
      #
      # The grep is not paranoia. `node --test` exits 0 when its file pattern
      # matches nothing, so a renamed directory or a mistyped glob turns this
      # step into a green tick that runs no tests at all — the one failure mode
      # a test suite must not have.
      #
      # The grep and the failure step below read TAP ("# pass N", "not ok").
      # Node 22 printed TAP when its output was piped; from Node 23 the
      # default reporter is spec everywhere ("ℹ pass N"), so the reporter is
      # named here rather than left to the Node version.
      - name: Integration tests (data layer)
        env:
          NODE_OPTIONS: --test-reporter=tap
        run: |
          set -o pipefail
          npm run test:integration | tee "$RUNNER_TEMP/integration.log"
          grep -qE '^# pass [1-9]' "$RUNNER_TEMP/integration.log" || {
            echo "::error::integration suite reported no passing tests — did the file pattern match nothing?"
            exit 1
          }
      # The suite's TAP output runs to tens of thousands of lines and a failing
      # test's report sits wherever its file finished, far from the end where
      # the log viewer and the API's log tail look. Repeat each failure (with
      # its YAML block: error, expected, actual, location, stack) at the end,
      # and keep the whole log as an artifact.
      - name: Integration failures
        if: failure()
        run: |
          log="$RUNNER_TEMP/integration.log"
          [ -f "$log" ] || exit 0
          grep -n -A45 -E '^\s*not ok ' "$log" | head -n 3000 || true
      - uses: actions/upload-artifact@v7
        if: failure()
        with:
          name: integration-log
          path: ${{ runner.temp }}/integration.log
          if-no-files-found: ignore
          retention-days: 7
      - run: npm run build
      - run: npx playwright install --with-deps chromium
      # 1.21.0: started the way the image starts it (start.cjs beside
      # server.js). /readyz waits for the migrations, so it is polled too.
      # e2e/cloud-mode.spec.ts starts its own cloud-mode servers from the
      # same build, on their own database.
      - name: Start server
        run: |
          cp -r .next/static .next/standalone/.next/
          mkdir -p .next/standalone/public && cp -r public/* .next/standalone/public/
          cp scripts/start.cjs .next/standalone/start.cjs
          # The integration tests above sealed values in this database, and
          # a server never writes a new key file over sealed data (1.21.0):
          # give it its key file, as an install has one on its uploads volume.
          mkdir -p "$RUNNER_TEMP/uploads"
          openssl rand -hex 32 > "$RUNNER_TEMP/uploads/.secret.key"
          COMPASSDOCS_UPLOAD_DIR="$RUNNER_TEMP/uploads" node .next/standalone/start.cjs &
          for i in $(seq 1 60); do
            curl -sf http://127.0.0.1:3998/healthz && break
            sleep 1
          done
          for i in $(seq 1 60); do
            curl -sf http://127.0.0.1:3998/readyz && break
            sleep 1
          done
          curl -sf http://127.0.0.1:3998/readyz
      - name: Run e2e suite
        run: npx playwright test
      - uses: actions/upload-artifact@v7
        if: failure()
        with:
          name: playwright-traces
          path: test-results/
          retention-days: 7
