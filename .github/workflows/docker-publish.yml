name: Publish Docker image

# Build and push a container image to GitHub Container Registry (GHCR) on
# every push to main:
#   - merge:  tags the build :main-<sha>
#   - latest: then points :latest at it, if its commit is still main's head
# Version tags (:X.Y.Z, :X.Y) come only from release.yml, which retags an
# existing main-<sha>; this workflow never builds a tag ref.
# Users then install/update by pulling ghcr.io/<owner>/compassdocs.
#
# The repo moved from the mattny20 account to the Felix-AZ-Solutions-LLC org,
# and GHCR can't move packages between accounts. Installs pull
# ghcr.io/mattny20/compassdocs, so both jobs also copy what they push to that
# legacy path (same digest), with skopeo: GITHUB_TOKEN reads the org path,
# mattny20's LEGACY_GHCR_TOKEN (in the "CompassDocs legacy image publishing"
# environment) writes the legacy one. The shared shell is in
# .github/scripts/legacy-ghcr.sh. See RELEASING.md, "Moving to the org".
#
# Each architecture is built on its OWN native runner (amd64 on ubuntu-latest,
# arm64 on ubuntu-24.04-arm) and pushed by digest; a final job stitches the
# per-arch images into one multi-arch manifest. This avoids QEMU emulation,
# which is slow and can crash heavy builds (e.g. Next.js/SWC) with SIGILL.
on:
  push:
    branches: [main]
  workflow_dispatch:

# bash -eo pipefail for every run step (GitHub's default, bash -e, lets a
# failing command early in a pipeline go unnoticed).
defaults:
  run:
    shell: bash

env:
  REGISTRY: ghcr.io
  IMAGE_NAME: ${{ github.repository }} # e.g. Felix-AZ-Solutions-LLC/CompassDocs (lowercased in steps)
  # Pre-move image path that installs pull; kept in step with IMAGE.
  LEGACY_IMAGE: ghcr.io/mattny20/compassdocs
  LEGACY_USER: mattny20

jobs:
  build:
    name: Build (${{ matrix.platform }})
    runs-on: ${{ matrix.runner }}
    permissions:
      contents: read
      packages: write
    strategy:
      fail-fast: false
      matrix:
        include:
          - platform: linux/amd64
            runner: ubuntu-latest
          - platform: linux/arm64
            runner: ubuntu-24.04-arm
    steps:
      - name: Prepare
        run: |
          platform=${{ matrix.platform }}
          echo "PLATFORM_PAIR=${platform//\//-}" >> "$GITHUB_ENV"
          echo "IMAGE=${REGISTRY}/${IMAGE_NAME,,}" >> "$GITHUB_ENV"

      - name: Checkout
        uses: actions/checkout@v7

      - name: Labels & annotations
        id: meta
        uses: docker/metadata-action@v6
        with:
          images: ${{ env.IMAGE }}

      - name: Set up Buildx
        uses: docker/setup-buildx-action@v4

      - name: Log in to GHCR
        uses: docker/login-action@v4
        with:
          registry: ${{ env.REGISTRY }}
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Build and push by digest
        id: build
        uses: docker/build-push-action@v7
        with:
          context: .
          platforms: ${{ matrix.platform }}
          labels: ${{ steps.meta.outputs.labels }}
          cache-from: type=gha,scope=${{ env.PLATFORM_PAIR }}
          cache-to: type=gha,mode=max,scope=${{ env.PLATFORM_PAIR }}
          # One clean image digest per arch — no provenance index to disambiguate.
          provenance: false
          outputs: type=image,name=${{ env.IMAGE }},push-by-digest=true,name-canonical=true,push=true

      - name: Export digest
        run: |
          mkdir -p "${{ runner.temp }}/digests"
          digest="${{ steps.build.outputs.digest }}"
          touch "${{ runner.temp }}/digests/${digest#sha256:}"

      - name: Upload digest
        uses: actions/upload-artifact@v7
        with:
          name: digests-${{ env.PLATFORM_PAIR }}
          path: ${{ runner.temp }}/digests/*
          if-no-files-found: error
          # Long enough to re-run a failed merge job days later.
          retention-days: 14

  # Pushes this build as :main-<sha> at both paths. No concurrency group:
  # each run writes its own tag, so runs can overlap, and none can be
  # cancelled while waiting (release.yml needs every main-<sha> it may tag).
  merge:
    name: Merge manifest & push main-<sha>
    runs-on: ubuntu-latest
    needs: [build]
    # Only main builds get tags; a dispatch from another branch just builds.
    if: github.ref == 'refs/heads/main'
    # Holds LEGACY_GHCR_TOKEN; deployable from main only.
    environment: "CompassDocs legacy image publishing"
    permissions:
      contents: read
      packages: write
    outputs:
      tag: ${{ steps.tag.outputs.tag }}
    env:
      RERUN: "Re-running this job is safe: it only (re)writes this build's main-<sha>."
    steps:
      - name: Prepare
        run: echo "IMAGE=${REGISTRY}/${IMAGE_NAME,,}" >> "$GITHUB_ENV"

      - name: Checkout (shared scripts)
        uses: actions/checkout@v7
        with:
          sparse-checkout: .github/scripts

      - name: Download digests
        uses: actions/download-artifact@v8
        with:
          path: ${{ runner.temp }}/digests
          pattern: digests-*
          merge-multiple: true

      - name: Set up Buildx
        uses: docker/setup-buildx-action@v4

      # flavor latest=false: metadata-action's default (latest=auto) would
      # add :latest by itself; the latest job below owns that tag.
      - name: Compute image tags
        id: meta
        uses: docker/metadata-action@v6
        with:
          images: ${{ env.IMAGE }}
          flavor: latest=false
          tags: |
            type=sha,prefix=main-,enable={{is_default_branch}}

      - name: Name this build's tag
        id: tag
        run: |
          mapfile -t TAGS < <(jq -r '.tags[] | sub("^.*:"; "")' <<< "$DOCKER_METADATA_OUTPUT_JSON")
          if [ "${#TAGS[@]}" -ne 1 ] || [[ "${TAGS[0]}" != main-* ]]; then
            echo "::error::Expected exactly one main-<sha> tag, got: ${TAGS[*]:-none}."
            exit 1
          fi
          echo "tag=${TAGS[0]}" >> "$GITHUB_OUTPUT"

      - name: Log in to GHCR
        uses: docker/login-action@v4
        with:
          registry: ${{ env.REGISTRY }}
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Create manifest list and push
        working-directory: ${{ runner.temp }}/digests
        run: |
          docker buildx imagetools create \
            $(jq -cr '.tags | map("-t " + .) | join(" ")' <<< "$DOCKER_METADATA_OUTPUT_JSON") \
            $(printf "${IMAGE}@sha256:%s " *)

      - name: Inspect image
        env:
          TAG: ${{ steps.tag.outputs.tag }}
        run: |
          docker buildx imagetools inspect "${IMAGE}:${TAG}"

      # A missing, refused or over-scoped token fails the job: skipping would
      # quietly stop updates for every install.
      - name: Copy to the legacy path (ghcr.io/mattny20/compassdocs)
        id: mirror
        env:
          TAG: ${{ steps.tag.outputs.tag }}
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          LEGACY_GHCR_TOKEN: ${{ secrets.LEGACY_GHCR_TOKEN }}
        run: |
          if [ "$IMAGE" = "$LEGACY_IMAGE" ]; then
            echo "::notice::This run already publishes to $LEGACY_IMAGE; nothing to copy."
            exit 0
          fi
          source .github/scripts/legacy-ghcr.sh
          legacy_login
          legacy_copy "$IMAGE:$TAG" "$LEGACY_IMAGE:$TAG"

      # Runs even when the copy failed, so a private org package is reported
      # too.
      - name: Check both paths are publicly pullable
        if: ${{ !cancelled() && steps.mirror.outcome != 'skipped' }}
        env:
          TAG: ${{ steps.tag.outputs.tag }}
        run: |
          source .github/scripts/legacy-ghcr.sh
          check_public_pull "$TAG"

  # Points :latest at both paths to this build, but only while its commit is
  # still the head of main, so a late or re-run job can't move it back.
  # cancel-in-progress: a newer push's latest job replaces this one, and it
  # re-checks the head itself, so losing this one changes nothing.
  latest:
    name: Move :latest
    runs-on: ubuntu-latest
    needs: [merge]
    environment: "CompassDocs legacy image publishing"
    concurrency:
      group: ghcr-latest
      cancel-in-progress: true
    permissions:
      contents: read
      packages: write
    env:
      TAG: ${{ needs.merge.outputs.tag }}
      RERUN: "Re-running this job is safe: it moves :latest only if its commit is still the head of main."
    steps:
      - name: Prepare
        run: echo "IMAGE=${REGISTRY}/${IMAGE_NAME,,}" >> "$GITHUB_ENV"

      - name: Checkout (shared scripts)
        uses: actions/checkout@v7
        with:
          sparse-checkout: .github/scripts

      - name: Check this build is still the head of main
        id: head
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          head=""
          for attempt in 1 2 3; do
            head=$(gh api "repos/$GITHUB_REPOSITORY/commits/main" --jq .sha) && break
            echo "Attempt $attempt to read the head of main failed."
            sleep 5
          done
          if [ -z "$head" ]; then
            echo "::error::Couldn't read the head of main from the GitHub API, so can't tell whether to move :latest. $RERUN"
            exit 1
          fi
          if [ "$head" = "$GITHUB_SHA" ]; then
            echo "move=true" >> "$GITHUB_OUTPUT"
          else
            echo "move=false" >> "$GITHUB_OUTPUT"
            echo "::notice::main is at $head now, not $GITHUB_SHA: leaving :latest for that commit's run."
          fi

      - name: Point :latest at this build (both paths)
        id: move
        if: steps.head.outputs.move == 'true'
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          LEGACY_GHCR_TOKEN: ${{ secrets.LEGACY_GHCR_TOKEN }}
        run: |
          source .github/scripts/legacy-ghcr.sh
          if [ "$IMAGE" = "$LEGACY_IMAGE" ]; then
            # Not under the org yet: one path, which GITHUB_TOKEN writes.
            org_login
            org_copy "$IMAGE:$TAG" "$IMAGE:latest"
            exit 0
          fi
          legacy_login
          org_copy "$IMAGE:$TAG" "$IMAGE:latest"
          legacy_copy "$IMAGE:$TAG" "$LEGACY_IMAGE:latest"

      # :latest must be this build's digest at both paths.
      - name: Check :latest at both paths
        if: ${{ !cancelled() && steps.move.outcome != 'skipped' }}
        run: |
          source .github/scripts/legacy-ghcr.sh
          fail=0
          check_public_pull "$TAG" latest || fail=1
          want="${DIGESTS["$IMAGE:$TAG"]:-}" got="${DIGESTS["$IMAGE:latest"]:-}"
          if [ -n "$want" ] && [ -n "$got" ] && [ "$want" != "$got" ]; then
            echo "::error title=latest is not this build::$IMAGE:latest is $got, $IMAGE:$TAG is $want. $RERUN"
            fail=1
          fi
          exit "$fail"
