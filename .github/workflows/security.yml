name: Security scan

# Dependency and filesystem vulnerability scanning: on every PR, on pushes to
# main, and weekly so new advisories against unchanged code still get caught.
#
# Every PR, not only those touching dependency files: both jobs are required
# checks in the main ruleset (.github/rulesets/main.json), and a required
# check whose workflow a path filter skipped never reports, so the PR could
# never merge. Both jobs take a minute or two, beside e2e's ten. A new
# advisory now fails every open PR, not just dependency PRs; fix it in its
# own PR (that's what main's push and weekly runs would demand anyway).
on:
  push:
    branches: [main]
  pull_request:
  schedule:
    - cron: "0 6 * * 1" # Mondays 06:00 UTC
  workflow_dispatch:

permissions:
  contents: read

jobs:
  npm-audit:
    name: npm audit (prod deps, high+)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v7
        with:
          node-version: 24
      # Production dependencies only; fails on high/critical advisories.
      - run: npm audit --omit=dev --audit-level=high

  trivy:
    name: Trivy scan (vulns + secrets)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - name: Run Trivy filesystem scan
        # Pinned to the maintained branch; Dependabot (github-actions) will
        # propose a version pin. 0.28.0 tag does not resolve.
        uses: aquasecurity/trivy-action@master
        with:
          scan-type: fs
          scan-ref: .
          scanners: vuln,secret,misconfig
          severity: HIGH,CRITICAL
          exit-code: "1"
          ignore-unfixed: true
