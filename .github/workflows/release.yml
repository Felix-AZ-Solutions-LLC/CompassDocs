name: Release

# Publish a GitHub Release (and version-tag the image) for the version in
# package.json. Run it from the Actions tab ("Run workflow") after the version
# bump is merged to main. It creates the tag + Release server-side via `gh`
# (using that version's CHANGELOG section as the notes) and adds the semver tags
# to the already-built container image — no rebuild.
on:
  workflow_dispatch:
    inputs:
      version:
        description: "Version to release (blank = use package.json)"
        required: false
      notes_only:
        description: "Only refresh the existing release's notes from CHANGELOG (no tag, no image retag)"
        required: false
        default: "false"

permissions:
  contents: write
  packages: write

jobs:
  release:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v7

      - name: Resolve version
        id: v
        run: |
          VERSION="${{ github.event.inputs.version }}"
          PKG_VERSION="$(node -p "require('./package.json').version")"
          if [ -z "$VERSION" ]; then VERSION="$PKG_VERSION"; fi
          # The app displays package.json's version (Settings → System, MCP
          # serverInfo). Releasing a different number would ship an image that
          # reports the wrong version — refuse instead.
          if [ "$VERSION" != "$PKG_VERSION" ]; then
            echo "::error::Version mismatch: releasing $VERSION but package.json says $PKG_VERSION. Bump package.json in the release PR first."
            exit 1
          fi
          echo "version=$VERSION" >> "$GITHUB_OUTPUT"
          echo "tag=v$VERSION" >> "$GITHUB_OUTPUT"
          echo "Releasing v$VERSION"

      - name: Build release notes from CHANGELOG
        run: |
          VERSION="${{ steps.v.outputs.version }}"
          awk -v ver="$VERSION" '
            $0 ~ "^## \\[" ver "\\]" { capture = 1; next }
            capture && (/^## \[/ || /^\[[0-9]/) { exit }
            capture { print }
          ' CHANGELOG.md > notes.md
          if [ ! -s notes.md ]; then echo "Release ${{ steps.v.outputs.tag }}." > notes.md; fi
          echo "----- notes -----"; cat notes.md

      - name: Create tag + GitHub Release
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          TAG="${{ steps.v.outputs.tag }}"
          if gh release view "$TAG" --repo "$GITHUB_REPOSITORY" >/dev/null 2>&1; then
            # The CHANGELOG is the source of truth for notes — refresh the
            # existing release instead of silently skipping.
            echo "Release $TAG already exists; refreshing notes from CHANGELOG."
            gh release edit "$TAG" --repo "$GITHUB_REPOSITORY" --notes-file notes.md
          else
            gh release create "$TAG" \
              --repo "$GITHUB_REPOSITORY" \
              --target "$GITHUB_SHA" \
              --title "$TAG" \
              --notes-file notes.md
          fi

      - name: Log in to GHCR
        if: github.event.inputs.notes_only != 'true'
        uses: docker/login-action@v4
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      # continue-on-error so the legacy retag below still runs if this one
      # fails; the last step turns either failure into a red job.
      - name: Add semver tags to the built image
        id: retag
        if: github.event.inputs.notes_only != 'true'
        continue-on-error: true
        run: |
          IMAGE="ghcr.io/${GITHUB_REPOSITORY,,}"
          SRC="$IMAGE:main-$(git rev-parse --short=7 HEAD)"
          VERSION="${{ steps.v.outputs.version }}"
          MM="${VERSION%.*}"
          echo "Retagging $SRC -> :$VERSION, :$MM, :latest"
          # :latest lets installs follow releases across minors — the compose
          # default, and what the admin console's one-click update relies on.
          docker buildx imagetools create -t "$IMAGE:$VERSION" -t "$IMAGE:$MM" -t "$IMAGE:latest" "$SRC"

      # Installs made before the move to the Felix-AZ-Solutions-LLC org pull
      # ghcr.io/mattny20/compassdocs; give it the same semver tags. Logs in as
      # mattny20 in a separate DOCKER_CONFIG (see docker-publish.yml and
      # RELEASING.md). No continue-on-error: a failure here must be seen.
      - name: Add semver tags on the legacy path (ghcr.io/mattny20/compassdocs)
        id: legacy_retag
        if: github.event.inputs.notes_only != 'true'
        env:
          LEGACY_IMAGE: ghcr.io/mattny20/compassdocs
          LEGACY_USER: mattny20
          LEGACY_GHCR_TOKEN: ${{ secrets.LEGACY_GHCR_TOKEN }}
        run: |
          IMAGE="ghcr.io/${GITHUB_REPOSITORY,,}"
          if [ "$IMAGE" = "$LEGACY_IMAGE" ]; then
            echo "::notice::The step above already tagged $LEGACY_IMAGE."
            exit 0
          fi
          if [ -z "$LEGACY_GHCR_TOKEN" ]; then
            echo "::error title=LEGACY_GHCR_TOKEN secret is missing::Existing installs pull $LEGACY_IMAGE and won't see this release. Add an Actions secret named LEGACY_GHCR_TOKEN (org or repo level) holding a classic personal access token from the $LEGACY_USER account with only the write:packages scope, then re-run this workflow. See RELEASING.md."
            exit 1
          fi
          SRC="$IMAGE:main-$(git rev-parse --short=7 HEAD)"
          VERSION="${{ steps.v.outputs.version }}"
          MM="${VERSION%.*}"
          export DOCKER_CONFIG="$RUNNER_TEMP/legacy-docker-config"
          mkdir -p "$DOCKER_CONFIG"
          printf '%s' "$LEGACY_GHCR_TOKEN" | docker login ghcr.io -u "$LEGACY_USER" --password-stdin
          echo "Retagging $SRC -> $LEGACY_IMAGE:$VERSION, :$MM, :latest"
          docker buildx imagetools create -t "$LEGACY_IMAGE:$VERSION" -t "$LEGACY_IMAGE:$MM" -t "$LEGACY_IMAGE:latest" "$SRC"
          docker logout ghcr.io || true
          rm -rf "$DOCKER_CONFIG"

      - name: Fail if an image retag failed
        if: ${{ !cancelled() && steps.retag.outcome == 'failure' }}
        run: |
          echo "::error title=Image retag failed::Couldn't add the semver tags on ghcr.io/${GITHUB_REPOSITORY,,} (see 'Add semver tags to the built image'). The release itself exists; re-run this workflow once docker-publish has finished for this commit."
          exit 1
