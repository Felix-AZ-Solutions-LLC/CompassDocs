name: Release

# Publish a GitHub Release (and version-tag the image) for the version in
# package.json. Run it from the Actions tab ("Run workflow") after the version
# bump is merged to main. It creates the tag + Release server-side via `gh`
# (using that version's CHANGELOG section as the notes) and adds the semver tags
# to the already-built container image — no rebuild.
on:
  workflow_dispatch:
    inputs:
      version:
        description: "Version to release (blank = use package.json)"
        required: false
      notes_only:
        description: "Only refresh the existing release's notes from CHANGELOG (no tag, no image retag)"
        required: false
        default: "false"

permissions:
  contents: write
  packages: write

jobs:
  release:
    runs-on: ubuntu-latest
    # Holds LEGACY_GHCR_TOKEN; deployable from main and v* tags only.
    environment: ghcr-legacy
    # Same group as docker-publish's merge job: one registry writer at a
    # time, so :latest can't end up on different builds at the two paths.
    concurrency:
      group: ghcr-publish
      cancel-in-progress: false
    env:
      # Pre-move image path that installs pull (see docker-publish.yml).
      LEGACY_IMAGE: ghcr.io/mattny20/compassdocs
      LEGACY_USER: mattny20
      RERUN: "Re-running this workflow is safe: it retags the build of the commit the version tag points at."
    steps:
      - name: Checkout
        uses: actions/checkout@v7

      - name: Resolve version
        id: v
        run: |
          VERSION="${{ github.event.inputs.version }}"
          PKG_VERSION="$(node -p "require('./package.json').version")"
          if [ -z "$VERSION" ]; then VERSION="$PKG_VERSION"; fi
          # The app displays package.json's version (Settings → System, MCP
          # serverInfo). Releasing a different number would ship an image that
          # reports the wrong version — refuse instead.
          if [ "$VERSION" != "$PKG_VERSION" ]; then
            echo "::error::Version mismatch: releasing $VERSION but package.json says $PKG_VERSION. Bump package.json in the release PR first."
            exit 1
          fi
          echo "version=$VERSION" >> "$GITHUB_OUTPUT"
          echo "tag=v$VERSION" >> "$GITHUB_OUTPUT"
          echo "Releasing v$VERSION"

      - name: Build release notes from CHANGELOG
        run: |
          VERSION="${{ steps.v.outputs.version }}"
          awk -v ver="$VERSION" '
            $0 ~ "^## \\[" ver "\\]" { capture = 1; next }
            capture && (/^## \[/ || /^\[[0-9]/) { exit }
            capture { print }
          ' CHANGELOG.md > notes.md
          if [ ! -s notes.md ]; then echo "Release ${{ steps.v.outputs.tag }}." > notes.md; fi
          echo "----- notes -----"; cat notes.md

      - name: Create tag + GitHub Release
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          TAG="${{ steps.v.outputs.tag }}"
          if gh release view "$TAG" --repo "$GITHUB_REPOSITORY" >/dev/null 2>&1; then
            # The CHANGELOG is the source of truth for notes — refresh the
            # existing release instead of silently skipping.
            echo "Release $TAG already exists; refreshing notes from CHANGELOG."
            gh release edit "$TAG" --repo "$GITHUB_REPOSITORY" --notes-file notes.md
          else
            gh release create "$TAG" \
              --repo "$GITHUB_REPOSITORY" \
              --target "$GITHUB_SHA" \
              --title "$TAG" \
              --notes-file notes.md
          fi

      # Retag the build of the commit vX.Y.Z points at, not whatever main is
      # now, so a later dispatch can't put this version on another build.
      - name: Find the release's build
        id: src
        if: github.event.inputs.notes_only != 'true'
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          TAG="${{ steps.v.outputs.tag }}"
          if ! TAG_SHA=$(gh api "repos/$GITHUB_REPOSITORY/commits/$TAG" --jq .sha) || [ -z "$TAG_SHA" ]; then
            echo "::error::Couldn't find the commit $TAG points at."
            exit 1
          fi
          # docker-publish tags each main build main-<first 7 of the sha>.
          echo "build=main-${TAG_SHA:0:7}" >> "$GITHUB_OUTPUT"
          if [ "$TAG_SHA" = "$GITHUB_SHA" ]; then
            echo "move_latest=true" >> "$GITHUB_OUTPUT"
          else
            # main has moved on; docker-publish already put :latest on a
            # newer build, and moving it back would downgrade installs.
            echo "move_latest=false" >> "$GITHUB_OUTPUT"
            echo "::notice::$TAG is $TAG_SHA, but this run is on $GITHUB_SHA. Tagging $TAG's build as its version only; :latest stays where it is."
          fi

      - name: Log in to GHCR
        if: github.event.inputs.notes_only != 'true'
        uses: docker/login-action@v4
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      # continue-on-error so the legacy retag below still runs if this one
      # fails; the last step turns either failure into a red job.
      - name: Add semver tags to the built image
        id: retag
        if: github.event.inputs.notes_only != 'true'
        continue-on-error: true
        run: |
          IMAGE="ghcr.io/${GITHUB_REPOSITORY,,}"
          SRC="$IMAGE:${{ steps.src.outputs.build }}"
          VERSION="${{ steps.v.outputs.version }}"
          MM="${VERSION%.*}"
          args=(-t "$IMAGE:$VERSION" -t "$IMAGE:$MM")
          # :latest lets installs follow releases across minors — the compose
          # default, and what the admin console's one-click update relies on.
          if [ "${{ steps.src.outputs.move_latest }}" = true ]; then args+=(-t "$IMAGE:latest"); fi
          echo "Retagging $SRC -> ${args[*]}"
          docker buildx imagetools create "${args[@]}" "$SRC"

      # The same tags on the pre-move path that installs pull, copied with
      # skopeo: GITHUB_TOKEN reads the org path, mattny20's token writes the
      # legacy one, each from its own auth file (removed on every exit). No
      # continue-on-error: a failure here must be seen.
      - name: Add semver tags on the legacy path (ghcr.io/mattny20/compassdocs)
        id: legacy_retag
        if: github.event.inputs.notes_only != 'true'
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          LEGACY_GHCR_TOKEN: ${{ secrets.LEGACY_GHCR_TOKEN }}
        run: |
          IMAGE="ghcr.io/${GITHUB_REPOSITORY,,}"
          if [ "$IMAGE" = "$LEGACY_IMAGE" ]; then
            echo "::notice::The step above already tagged $LEGACY_IMAGE."
            exit 0
          fi
          if [ -z "$LEGACY_GHCR_TOKEN" ]; then
            echo "::error title=LEGACY_GHCR_TOKEN secret is missing::Installs pull $LEGACY_IMAGE and won't see this release. Add LEGACY_GHCR_TOKEN to this repo's ghcr-legacy environment: a classic personal access token from the $LEGACY_USER account with only the write:packages scope (RELEASING.md). $RERUN"
            exit 1
          fi
          SRC="$IMAGE:${{ steps.src.outputs.build }}"
          VERSION="${{ steps.v.outputs.version }}"
          TAGS=("$VERSION" "${VERSION%.*}")
          if [ "${{ steps.src.outputs.move_latest }}" = true ]; then TAGS+=(latest); fi
          command -v skopeo >/dev/null || { sudo apt-get update -q && sudo apt-get install -y -q skopeo; }
          SRC_AUTH="$RUNNER_TEMP/ghcr-src-auth.json"
          DST_AUTH="$RUNNER_TEMP/ghcr-legacy-auth.json"
          trap 'rm -f "$SRC_AUTH" "$DST_AUTH"' EXIT
          if ! printf '%s' "$GITHUB_TOKEN" | skopeo login --authfile "$SRC_AUTH" -u "$GITHUB_ACTOR" --password-stdin ghcr.io; then
            echo "::error title=GITHUB_TOKEN login failed::Couldn't log in to ghcr.io with this run's GITHUB_TOKEN. $RERUN"
            exit 1
          fi
          if ! printf '%s' "$LEGACY_GHCR_TOKEN" | skopeo login --authfile "$DST_AUTH" -u "$LEGACY_USER" --password-stdin ghcr.io; then
            echo "::error title=LEGACY_GHCR_TOKEN was refused::ghcr.io refused the $LEGACY_USER token (expired or revoked?). Make a new classic token from $LEGACY_USER with only write:packages and replace LEGACY_GHCR_TOKEN in the ghcr-legacy environment (RELEASING.md). $RERUN"
            exit 1
          fi
          for t in "${TAGS[@]}"; do
            echo "Copying $SRC -> $LEGACY_IMAGE:$t"
            if ! skopeo copy --all --preserve-digests --retry-times 3 \
                --src-authfile "$SRC_AUTH" --dest-authfile "$DST_AUTH" \
                "docker://$SRC" "docker://$LEGACY_IMAGE:$t"; then
              echo "::error title=Copy to $LEGACY_IMAGE failed::Couldn't tag $LEGACY_IMAGE:$t (see the log above). $RERUN"
              exit 1
            fi
          done

      - name: Fail if an image retag failed
        if: ${{ !cancelled() && steps.retag.outcome == 'failure' }}
        run: |
          echo "::error title=Image retag failed::Couldn't add the semver tags on ghcr.io/${GITHUB_REPOSITORY,,} (see 'Add semver tags to the built image'). The release itself exists. Check that docker-publish finished for ${{ steps.src.outputs.build }}. $RERUN"
          exit 1
