name: Release

# Publish a GitHub Release (and version-tag the image) for the version in
# package.json. Run it from the Actions tab ("Run workflow") after the version
# bump is merged to main. It creates the tag + Release server-side via `gh`
# (using that version's CHANGELOG section as the notes) and adds :X.Y.Z and
# :X.Y to the already-built container image — no rebuild. It never touches
# :latest: docker-publish moves that to each new head of main.
on:
  workflow_dispatch:
    inputs:
      version:
        description: "Version to release (blank = use package.json)"
        required: false
      notes_only:
        description: "Only refresh the existing release's notes from CHANGELOG (no tag, no image retag)"
        type: boolean
        default: false

permissions:
  contents: write
  packages: write

# bash -eo pipefail for every run step (GitHub's default, bash -e, would let
# a failing `git ls-remote` early in a pipeline go unnoticed).
defaults:
  run:
    shell: bash

jobs:
  release:
    runs-on: ubuntu-latest
    # Holds LEGACY_GHCR_TOKEN; deployable from main only.
    environment: ghcr-legacy
    # Its own group, not docker-publish's: GitHub keeps one waiting run per
    # group, so sharing would let a release cancel a waiting merge job. A
    # notes-only run touches no image and gets a group of its own.
    concurrency:
      group: ${{ inputs.notes_only && format('release-notes-{0}', github.run_id) || 'release' }}
      cancel-in-progress: false
    env:
      REGISTRY: ghcr.io
      # Pre-move image path that installs pull (see docker-publish.yml).
      LEGACY_IMAGE: ghcr.io/mattny20/compassdocs
      LEGACY_USER: mattny20
      RERUN: "Then dispatch a new run of release.yml (or re-run this one): it only adds :X.Y.Z, and :X.Y while this is the newest X.Y release, to the build of the commit the version tag points at."
    steps:
      - name: Checkout
        uses: actions/checkout@v7

      - name: Resolve version
        id: v
        env:
          VERSION: ${{ github.event.inputs.version }}
        run: |
          PKG_VERSION="$(node -p "require('./package.json').version")"
          if [ -z "$VERSION" ]; then VERSION="$PKG_VERSION"; fi
          # The app displays package.json's version (Settings → System, MCP
          # serverInfo). Releasing a different number would ship an image that
          # reports the wrong version — refuse instead.
          if [ "$VERSION" != "$PKG_VERSION" ]; then
            echo "::error::Version mismatch: releasing $VERSION but package.json says $PKG_VERSION. Bump package.json in the release PR first."
            exit 1
          fi
          echo "version=$VERSION" >> "$GITHUB_OUTPUT"
          echo "tag=v$VERSION" >> "$GITHUB_OUTPUT"
          echo "Releasing v$VERSION"

      - name: Build release notes from CHANGELOG
        env:
          VERSION: ${{ steps.v.outputs.version }}
          TAG: ${{ steps.v.outputs.tag }}
        run: |
          awk -v ver="$VERSION" '
            $0 ~ "^## \\[" ver "\\]" { capture = 1; next }
            capture && (/^## \[/ || /^\[[0-9]/) { exit }
            capture { print }
          ' CHANGELOG.md > notes.md
          if [ ! -s notes.md ]; then echo "Release $TAG." > notes.md; fi
          echo "----- notes -----"; cat notes.md

      - name: Create tag + GitHub Release
        env:
          GH_TOKEN: ${{ github.token }}
          NOTES_ONLY: ${{ inputs.notes_only }}
          TAG: ${{ steps.v.outputs.tag }}
        run: |
          if [ "$NOTES_ONLY" = true ] && ! gh release view "$TAG" --repo "$GITHUB_REPOSITORY" >/dev/null; then
            # Notes-only runs sit outside the release group, so they must
            # never create a tag or release (or retag images).
            echo "::error title=No release to refresh::$TAG has no GitHub release yet (or it couldn't be read). Run release.yml without notes only to create it."
            exit 1
          fi
          if gh release view "$TAG" --repo "$GITHUB_REPOSITORY" >/dev/null 2>&1; then
            # The CHANGELOG is the source of truth for notes — refresh the
            # existing release instead of silently skipping.
            echo "Release $TAG already exists; refreshing notes from CHANGELOG."
            gh release edit "$TAG" --repo "$GITHUB_REPOSITORY" --notes-file notes.md
          else
            gh release create "$TAG" \
              --repo "$GITHUB_REPOSITORY" \
              --target "$GITHUB_SHA" \
              --title "$TAG" \
              --notes-file notes.md
          fi

      # Retag the build of the commit vX.Y.Z points at, not whatever main is
      # now, so a later dispatch can't put this version on another build.
      # :X.Y goes only to the newest released X.Y.*, so re-running an older
      # release can't move it back.
      - name: Find the release's build
        id: src
        if: ${{ !inputs.notes_only }}
        env:
          GH_TOKEN: ${{ github.token }}
          TAG: ${{ steps.v.outputs.tag }}
          VERSION: ${{ steps.v.outputs.version }}
        run: |
          MM="${VERSION%.*}"
          if ! TAG_SHA=$(gh api "repos/$GITHUB_REPOSITORY/commits/$TAG" --jq .sha) || [ -z "$TAG_SHA" ]; then
            echo "::error::Couldn't find the commit $TAG points at."
            exit 1
          fi
          if [ "$TAG_SHA" != "$GITHUB_SHA" ]; then
            echo "::notice::$TAG is $TAG_SHA (this run is on $GITHUB_SHA); tagging that commit's build."
          fi
          # docker-publish tags each main build main-<first 7 of the sha>.
          echo "build=main-${TAG_SHA:0:7}" >> "$GITHUB_OUTPUT"
          # pipefail: a failed ls-remote fails this, rather than looking like
          # "no newer tag". This release's own tag exists by now, so an empty
          # answer is an error too.
          if ! newest=$(git ls-remote --tags --refs origin "refs/tags/v$MM.*" | sed 's#.*refs/tags/v##' \
              | { grep -E "^${MM//./\\.}\.[0-9]+$" || true; } | sort -V | tail -n1) || [ -z "$newest" ]; then
            echo "::error::Couldn't list the v$MM.* tags (expected at least $TAG), so can't tell whether to move :$MM. $RERUN"
            exit 1
          fi
          if [ "$newest" = "$VERSION" ]; then
            echo "tags=$VERSION $MM" >> "$GITHUB_OUTPUT"
          else
            echo "tags=$VERSION" >> "$GITHUB_OUTPUT"
            echo "::notice::v$newest is newer than $TAG, so :$MM stays on it."
          fi

      # Pin the build once: the org path's main-<sha> digest, which the
      # legacy path's main-<sha> must match. Both retags below copy that exact
      # digest, so a rebuild in between can't split the version tags.
      - name: Pin the build's digest
        id: pin
        if: ${{ !inputs.notes_only }}
        env:
          BUILD: ${{ steps.src.outputs.build }}
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          LEGACY_GHCR_TOKEN: ${{ secrets.LEGACY_GHCR_TOKEN }}
        run: |
          IMAGE="ghcr.io/${GITHUB_REPOSITORY,,}"
          source .github/scripts/legacy-ghcr.sh
          if [ "$IMAGE" = "$LEGACY_IMAGE" ]; then org_login; else legacy_login; fi
          if ! digest=$(registry_digest "$SRC_AUTH" "$IMAGE:$BUILD"); then
            echo "::error title=$BUILD not found::$IMAGE:$BUILD isn't there. Check that docker-publish's merge job finished for it, or run docker-publish by hand on main if that commit had no run (pushed with [skip ci]). $RERUN"
            exit 1
          fi
          if [ "$IMAGE" != "$LEGACY_IMAGE" ]; then
            legacy=$(registry_digest "$DST_AUTH" "$LEGACY_IMAGE:$BUILD") || legacy="missing"
            if [ "$legacy" != "$digest" ]; then
              echo "::error title=$BUILD differs between the paths::$IMAGE:$BUILD is $digest but $LEGACY_IMAGE:$BUILD is $legacy. Check docker-publish's merge job for that commit; nothing was tagged. $RERUN"
              exit 1
            fi
          fi
          echo "Pinned $BUILD = $digest"
          echo "digest=$digest" >> "$GITHUB_OUTPUT"

      # Same skopeo copy (--preserve-digests) as the legacy side and
      # docker-publish, via .github/scripts/legacy-ghcr.sh. continue-on-error
      # so the legacy retag below still runs if this one fails; the last step
      # turns either failure into a red job.
      - name: Add semver tags to the built image
        id: retag
        if: ${{ !inputs.notes_only }}
        continue-on-error: true
        env:
          DIGEST: ${{ steps.pin.outputs.digest }}
          TAGS: ${{ steps.src.outputs.tags }}
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          IMAGE="ghcr.io/${GITHUB_REPOSITORY,,}"
          source .github/scripts/legacy-ghcr.sh
          org_login
          for t in $TAGS; do
            org_copy "$IMAGE@$DIGEST" "$IMAGE:$t"
          done

      # The same tags on the pre-move path that installs pull, copied with
      # skopeo (.github/scripts/legacy-ghcr.sh): GITHUB_TOKEN reads the org
      # path, mattny20's token writes the legacy one. No continue-on-error: a
      # failure here must be seen.
      - name: Add semver tags on the legacy path (ghcr.io/mattny20/compassdocs)
        id: legacy_retag
        if: ${{ !inputs.notes_only }}
        env:
          DIGEST: ${{ steps.pin.outputs.digest }}
          TAGS: ${{ steps.src.outputs.tags }}
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          LEGACY_GHCR_TOKEN: ${{ secrets.LEGACY_GHCR_TOKEN }}
        run: |
          IMAGE="ghcr.io/${GITHUB_REPOSITORY,,}"
          if [ "$IMAGE" = "$LEGACY_IMAGE" ]; then
            echo "::notice::The step above already tagged $LEGACY_IMAGE."
            exit 0
          fi
          source .github/scripts/legacy-ghcr.sh
          legacy_login
          for t in $TAGS; do
            legacy_copy "$IMAGE@$DIGEST" "$LEGACY_IMAGE:$t"
          done

      # Each new tag must be the pinned digest, the same at both paths.
      - name: Check the version tags at both paths
        if: ${{ !cancelled() && !inputs.notes_only && steps.pin.outcome == 'success' }}
        env:
          DIGEST: ${{ steps.pin.outputs.digest }}
          TAGS: ${{ steps.src.outputs.tags }}
        run: |
          IMAGE="ghcr.io/${GITHUB_REPOSITORY,,}"
          source .github/scripts/legacy-ghcr.sh
          read -ra tags <<< "$TAGS"
          fail=0
          check_public_pull "${tags[@]}" || fail=1
          for t in "${tags[@]}"; do
            got="${DIGESTS["$IMAGE:$t"]:-}"
            if [ -n "$got" ] && [ "$got" != "$DIGEST" ]; then
              echo "::error title=Tag $t isn't the release build::$IMAGE:$t is $got, expected $DIGEST. $RERUN"
              fail=1
            fi
          done
          exit "$fail"

      - name: Fail if an image retag failed
        if: ${{ !cancelled() && steps.retag.outcome == 'failure' }}
        env:
          BUILD: ${{ steps.src.outputs.build }}
        run: |
          echo "::error title=Image retag failed::Couldn't add the semver tags on ghcr.io/${GITHUB_REPOSITORY,,} (see 'Add semver tags to the built image'). The release itself exists. Check that docker-publish's merge job finished for $BUILD. $RERUN"
          exit 1
