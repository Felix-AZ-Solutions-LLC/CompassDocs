name: TLS smoke test

# Boots the real HTTPS stack (app + Postgres + Caddy, from the TLS compose
# file) and exercises the whole domain/TLS flow end to end: setup wizard →
# login → save a domain with the internal CA → assert the config push reached
# Caddy and HTTPS actually serves the app. This is the test that would have
# caught both the `command: ["run", …]` startup failure and the admin-API
# origin 403s before a customer did.
#
# 1.20.29: a domain is checked before the proxy switches to it. The smoke's
# name has no public DNS, so the first save must be REFUSED (left pending,
# the bootstrap address still serving); "Use it anyway" (`force: true`, what
# the UI's button sends) then takes the real apply path. A fallback host
# (COMPASSDOCS_FALLBACK_HOSTS) must keep answering once the domain is live,
# and the check's own path must reach the app on any host over plain HTTP.

on:
  pull_request:
    paths:
      - "deploy/**"
      - "src/lib/caddy.ts"
      - "src/lib/domain-*.ts"
      - "src/lib/fallback-hosts.ts"
      - "src/app/api/admin/domain/**"
      - "src/app/.well-known/compassdocs-domain-check/**"
      - "src/instrumentation.ts"
      - "Dockerfile"
      - "install.sh"
      - ".github/workflows/tls-smoke.yml"
  push:
    branches: [main]
    paths:
      - "deploy/**"
      - "src/lib/caddy.ts"
      - "src/lib/domain-*.ts"
      - "src/lib/fallback-hosts.ts"
      - "src/app/api/admin/domain/**"
      - "src/app/.well-known/compassdocs-domain-check/**"
      - "src/instrumentation.ts"
      - "Dockerfile"
      - "install.sh"
      - ".github/workflows/tls-smoke.yml"
  workflow_dispatch:

jobs:
  tls-smoke:
    runs-on: ubuntu-latest
    timeout-minutes: 25
    defaults:
      run:
        working-directory: /tmp/stack
    steps:
      - uses: actions/checkout@v7

      - name: Build the app image from this ref
        working-directory: ${{ github.workspace }}
        run: docker build -t compassdocs-test:local .

      - name: Assemble the TLS stack (compose + Caddyfile from this ref)
        working-directory: ${{ github.workspace }}
        run: |
          mkdir -p /tmp/stack
          cp deploy/docker-compose.tls.yml /tmp/stack/docker-compose.yml
          cp deploy/Caddyfile /tmp/stack/Caddyfile
          # run the image we just built instead of the published one
          sed -i 's|image: ghcr.io/mattny20/compassdocs:.*|image: compassdocs-test:local|' /tmp/stack/docker-compose.yml
          echo "POSTGRES_PASSWORD=smoketest123" > /tmp/stack/.env
          # 1.20.27: a fresh install is claimed only with the setup token; preset it for the smoke.
          echo "COMPASSDOCS_SETUP_TOKEN=smoke-setup-token" >> /tmp/stack/.env
          # 1.20.29: an address that must keep working after the domain is applied.
          echo "COMPASSDOCS_FALLBACK_HOSTS=fallback.compassdocs.test" >> /tmp/stack/.env

      - name: Start the stack
        run: docker compose up -d

      - name: App reachable over plain HTTP through Caddy (bootstrap state)
        run: |
          for i in $(seq 1 60); do
            if curl -sf http://localhost/login -o /dev/null; then exit 0; fi
            sleep 2
          done
          echo "::error::App never became reachable through Caddy on :80"
          docker compose ps; docker compose logs; exit 1

      - name: Setup wizard + login (through the proxy)
        run: |
          curl -sf -X POST http://localhost/api/setup -H 'content-type: application/json' \
            -d '{"username":"admin","name":"Smoke Test","email":"smoke@test.local","password":"Sm0keTest!Sm0keTest!","company":"Smoke Inc","setup_token":"smoke-setup-token"}'
          curl -sf -c /tmp/stack/jar -X POST http://localhost/api/auth/login -H 'content-type: application/json' \
            -d '{"username":"admin","password":"Sm0keTest!Sm0keTest!"}'

      - name: Save a domain without public DNS — the check refuses, nothing switches
        run: |
          RESP=$(curl -sf -b /tmp/stack/jar -X PATCH http://localhost/api/admin/domain \
            -H 'content-type: application/json' \
            -d '{"custom_domain":"smoke.compassdocs.test","tls_mode":"internal"}')
          echo "$RESP"
          echo "$RESP" | python3 -c "import sys,json; d=json.load(sys.stdin); assert d.get('ok') is True, d; assert d.get('outcome') == 'pending', ('the check should have refused a name with no DNS', d); assert d.get('applied') is False, d; assert d['state']['custom_domain'] == '', d; assert d['state']['pending']['domain'] == 'smoke.compassdocs.test', d; assert d['check']['ok'] is False and d['check']['message'], d; print('refused as pending:', d['check']['message'])"
          # The bootstrap config is still the one serving: plain HTTP on any host.
          CODE=$(curl -s -o /dev/null -w "%{http_code}" http://localhost/login)
          echo "bootstrap http -> $CODE"
          test "$CODE" = "200"

      - name: Use it anyway (force) — the push must APPLY
        run: |
          RESP=$(curl -sf -b /tmp/stack/jar -X PATCH http://localhost/api/admin/domain \
            -H 'content-type: application/json' \
            -d '{"custom_domain":"smoke.compassdocs.test","tls_mode":"internal","force":true}')
          echo "$RESP"
          echo "$RESP" | python3 -c "import sys,json; d=json.load(sys.stdin); assert d.get('ok') is True, d; assert d.get('outcome') == 'forced', d; assert d.get('applied') is True, ('proxy did NOT apply', d); assert d['state']['proxy']['reachable'] is True, d; assert d['state']['custom_domain'] == 'smoke.compassdocs.test', d; assert d['state']['pending'] is None, d; assert [f['host'] for f in d['state']['fallbacks']] == ['fallback.compassdocs.test'], d; print('config push applied OK')"

      - name: HTTPS serves the app on the configured domain
        run: |
          sleep 3
          CODE=$(curl -sk -o /dev/null -w "%{http_code}" --resolve smoke.compassdocs.test:443:127.0.0.1 https://smoke.compassdocs.test/login)
          echo "https -> $CODE"
          test "$CODE" = "200"
          curl -sk --resolve smoke.compassdocs.test:443:127.0.0.1 https://smoke.compassdocs.test/login | grep -q "Sign in"
          REDIR=$(curl -s -o /dev/null -w "%{http_code}" --resolve smoke.compassdocs.test:80:127.0.0.1 http://smoke.compassdocs.test/)
          echo "http -> $REDIR (expect 3xx redirect to https)"
          case "$REDIR" in 3*) : ;; *) echo "::error::HTTP did not redirect to HTTPS"; exit 1;; esac

      - name: A second save must also apply (generated config keeps admin access open)
        run: |
          # Port 80 now (correctly) redirects to HTTPS, so this save goes over
          # TLS on the configured domain, carrying the session cookie manually.
          COOKIE=$(awk '/compass_session/ {print $NF}' /tmp/stack/jar)
          RESP=$(curl -sk --resolve smoke.compassdocs.test:443:127.0.0.1 \
            -H "Cookie: compass_session=$COOKIE" \
            -X PATCH https://smoke.compassdocs.test/api/admin/domain \
            -H 'content-type: application/json' \
            -d '{"custom_domain":"smoke.compassdocs.test","tls_mode":"internal","tls_email":""}')
          echo "$RESP"
          # The same domain and mode: a re-apply, no check needed.
          echo "$RESP" | python3 -c "import sys,json; d=json.load(sys.stdin); assert d.get('applied') is True, d; assert d.get('outcome') == 'saved', d; print('second push applied OK')"

      - name: The fallback host still answers after the domain is applied
        run: |
          # Plain HTTP redirects to HTTPS on the fallback itself; HTTPS serves the app.
          LOC=$(curl -s -o /dev/null -w "%{http_code} %{redirect_url}" --resolve fallback.compassdocs.test:80:127.0.0.1 http://fallback.compassdocs.test/login)
          echo "fallback http -> $LOC"
          test "$LOC" = "308 https://fallback.compassdocs.test/login"
          CODE=$(curl -sk -o /dev/null -w "%{http_code}" --resolve fallback.compassdocs.test:443:127.0.0.1 https://fallback.compassdocs.test/login)
          echo "fallback https -> $CODE"
          test "$CODE" = "200"
          curl -sk --resolve fallback.compassdocs.test:443:127.0.0.1 https://fallback.compassdocs.test/login | grep -q "Sign in"

      - name: The domain check reaches the app on any host over plain HTTP
        run: |
          # A name the proxy doesn't serve yet: the check's path reaches the
          # app, whose answer to an unknown token carries a header only that
          # route sends; everything else redirects to the custom domain.
          HDRS=$(curl -s -D - -o /dev/null -H 'Host: next.compassdocs.test' http://localhost/.well-known/compassdocs-domain-check/not-a-token)
          echo "$HDRS"
          echo "$HDRS" | head -1 | grep -q " 404"
          echo "$HDRS" | grep -qi '^x-compassdocs-domain-check: unknown-token'
          LOC=$(curl -s -o /dev/null -w "%{http_code} %{redirect_url}" -H 'Host: next.compassdocs.test' http://localhost/login)
          echo "other path, unknown host -> $LOC (expect 308 to https://smoke.compassdocs.test/login)"
          test "$LOC" = "308 https://smoke.compassdocs.test/login"
          # An IP address goes to the domain too, never to https://<ip> (no certificate there).
          LOC=$(curl -s -o /dev/null -w "%{http_code} %{redirect_url}" http://127.0.0.1/login)
          echo "IP -> $LOC"
          test "$LOC" = "308 https://smoke.compassdocs.test/login"
          HDRS=$(curl -s -D - -o /dev/null --resolve smoke.compassdocs.test:80:127.0.0.1 http://smoke.compassdocs.test/.well-known/compassdocs-domain-check/not-a-token)
          echo "$HDRS" | grep -qi '^x-compassdocs-domain-check: unknown-token'

      - name: No admin-API rejections in the Caddy log
        run: |
          if docker compose logs caddy | grep -i "not allowed to access from origin"; then
            echo "::error::Caddy rejected admin-API requests from the app"
            exit 1
          fi
          echo "caddy admin log clean ✓"

      - name: Dump logs on failure
        if: failure()
        run: docker compose ps; docker compose logs
